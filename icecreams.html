<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ice Creams</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.5)
                ),
                url("icecream.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 600px;
            padding: 40px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 20px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 35px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 10px;

            margin-bottom: 25px;
            padding: 15px;

            border-radius: 10px;
            background: #f5f5f5;
        }

        .item label {
            flex: 1;
            font-weight: bold;
        }

        select {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .buttons {
            text-align: center;
            margin-top: 25px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        #icecreamresult {
            display: block;
            text-align: center;

            font-size: 20px;
            font-weight: bold;

            margin-top: 20px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>🍨 Explore Your Favourite Ice Creams</h2>


        <div class="item">

            <input type="checkbox" id="chocolate">

            <label>
                Chocolate - ₹100
            </label>

            <select id="chocolatequantity">

                <option value=""></option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>

            </select>

        </div>


        <div class="item">

            <input type="checkbox" id="blueberry">

            <label>
                Blueberry - ₹120
            </label>

            <select id="blueberryquantity">

                <option value=""></option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>

            </select>

        </div>


        <div class="item">

            <input type="checkbox" id="butterscotch">

            <label>
                Butterscotch - ₹150
            </label>

            <select id="butterscotchquantity">

                <option value=""></option>

                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>

            </select>

        </div>


        <div class="buttons">

            <button onclick="calculateIcecream()">
                Calculate
            </button>

        </div>


        <label id="icecreamresult"></label>


        <div class="buttons">

            <button onclick="window.location.href='billing.html'">
                Final Bill →
            </button>

        </div>

    </div>


    <script src="icecreams.js"></script>

</body>
</html>
