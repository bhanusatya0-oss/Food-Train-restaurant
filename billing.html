<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Final Bill</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("billing.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .bill-container {
            width: 600px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.96);

            border-radius: 20px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 10px;

            font-size: 34px;
        }

        .restaurant-subtitle {
            text-align: center;

            color: #777;

            margin-bottom: 30px;
        }

        h3 {
            text-align: center;

            margin-bottom: 25px;

            font-size: 22px;
        }

        .order-section {
            background: #f7f7f7;

            padding: 20px;

            border-radius: 12px;

            margin-bottom: 20px;
        }

        .order-section p {
            font-size: 17px;

            margin: 12px 0;

            padding-bottom: 8px;

            border-bottom: 1px solid #ddd;
        }

        .calculation-section {
            margin-top: 20px;
        }

        .calculation-section p {
            font-size: 17px;

            margin: 12px 0;
        }

        #discount {
            font-weight: bold;
        }

        #finalbill {
            text-align: center;

            margin-top: 25px;

            padding: 20px;

            border-radius: 12px;

            font-size: 28px;

            font-weight: bold;

            background: #f1f1f1;
        }

        hr {
            border: none;

            border-top: 1px solid #ccc;

            margin: 25px 0;
        }

    </style>
</head>

<body>

    <div class="bill-container">

        <h1>🍽️ FoodTrain Restaurant</h1>

        <p class="restaurant-subtitle">
            Thank you for dining with us!
        </p>


        <h3>🧾 Order Summary</h3>


        <div class="order-section">

            <p id="maincoursebill"></p>

            <p id="starterbill"></p>

            <p id="beveragebill"></p>

            <p id="icecreambill"></p>

        </div>


        <hr>


        <div class="calculation-section">

            <p id="subtotal"></p>

            <p id="discount"></p>

            <p id="afterdiscount"></p>

            <p id="gst"></p>

        </div>


        <hr>


        <h2 id="finalbill"></h2>

    </div>


    <script src="billing.js"></script>

</body>
</html>
