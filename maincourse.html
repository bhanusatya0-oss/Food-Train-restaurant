<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main Course | FoodTrain</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: "Montserrat", sans-serif;

            background:
                radial-gradient(circle at 15% 20%, rgba(187, 122, 43, 0.25), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(91, 45, 104, 0.30), transparent 35%),
                linear-gradient(135deg, #210d18, #3b1327, #180b20);

            color: #fff;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;

            overflow-x: hidden;
        }


        /* Decorative background */

        body::before {
            content: "";
            position: fixed;

            width: 300px;
            height: 300px;

            border: 1px solid rgba(216, 174, 92, 0.25);
            border-radius: 50%;

            top: -120px;
            left: -100px;

            animation: rotate 15s linear infinite;
        }

        body::after {
            content: "";

            position: fixed;

            width: 250px;
            height: 250px;

            border: 1px solid rgba(216, 174, 92, 0.20);
            border-radius: 50%;

            bottom: -100px;
            right: -80px;

            animation: rotate 18s linear infinite reverse;
        }


        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* Main container */

        .container {
            width: 720px;
            max-width: 100%;

            padding: 45px;

            background: rgba(255, 255, 255, 0.09);

            border: 1px solid rgba(255, 255, 255, 0.18);

            border-radius: 28px;

            backdrop-filter: blur(18px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.10);

            position: relative;
            z-index: 2;

            animation: appear 0.8s ease;
        }


        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* Heading */

        .heading {
            text-align: center;
            margin-bottom: 35px;
        }

        .heading small {
            color: #d8ae5c;

            font-size: 12px;

            letter-spacing: 4px;

            text-transform: uppercase;

            font-weight: 600;
        }

        h2 {
            font-family: "Cormorant Garamond", serif;

            font-size: 48px;

            margin: 8px 0;

            color: #fff4d8;

            font-weight: 700;
        }

        .subtitle {
            margin: 0;

            color: rgba(255, 255, 255, 0.68);

            font-size: 14px;
        }


        /* Food items */

        .item {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;

            padding: 14px;

            border-radius: 18px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.10);

            transition: 0.35s ease;
        }


        .item:hover {
            transform: translateY(-4px);

            background: rgba(255, 255, 255, 0.13);

            border-color: rgba(216, 174, 92, 0.55);

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.25),
                0 0 20px rgba(216, 174, 92, 0.08);
        }


        /* Food image */

        .food-image {
            width: 80px;
            height: 80px;

            border-radius: 15px;

            object-fit: cover;

            flex-shrink: 0;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.35);

            transition: 0.4s ease;
        }


        .item:hover .food-image {
            transform: scale(1.06);
        }


        /* Checkbox */

        .item input[type="checkbox"] {
            width: 19px;
            height: 19px;

            accent-color: #d8ae5c;

            cursor: pointer;

            flex-shrink: 0;
        }


        /* Food information */

        .food-info {
            flex: 1;
        }

        .food-name {
            display: block;

            color: #fff;

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 5px;
        }

        .price {
            color: #d8ae5c;

            font-size: 14px;

            font-weight: 600;
        }


        /* Quantity */

        .quantity-box {
            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 5px;
        }

        .quantity-box span {
            color: rgba(255, 255, 255, 0.55);

            font-size: 9px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        select {
            padding: 9px 12px;

            min-width: 60px;

            border-radius: 10px;

            border: 1px solid rgba(216, 174, 92, 0.45);

            background: #291321;

            color: #fff;

            font-family: "Montserrat", sans-serif;

            outline: none;

            cursor: pointer;
        }


        /* Buttons */

        .buttons {
            text-align: center;

            margin-top: 28px;
        }

        button {
            padding: 13px 30px;

            border: none;

            border-radius: 30px;

            font-family: "Montserrat", sans-serif;

            font-size: 13px;

            font-weight: 600;

            letter-spacing: 0.5px;

            cursor: pointer;

            color: #24101a;

            background: linear-gradient(
                135deg,
                #e7c777,
                #b98535
            );

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);

            transition: 0.3s ease;
        }


        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 28px rgba(216, 174, 92, 0.28);
        }


        /* Result */

        #maincourseresult {
            display: block;

            text-align: center;

            margin-top: 25px;

            min-height: 25px;

            color: #f4d78b;

            font-size: 18px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }


        /* Next button */

        .next-button {
            background: transparent;

            color: #f3d58b;

            border: 1px solid rgba(216, 174, 92, 0.55);

            box-shadow: none;
        }

        .next-button:hover {
            background: rgba(216, 174, 92, 0.12);

            box-shadow:
                0 8px 20px rgba(216, 174, 92, 0.12);
        }


        /* Mobile */

        @media (max-width: 600px) {

            .container {
                padding: 28px 20px;
            }

            h2 {
                font-size: 38px;
            }

            .item {
                gap: 10px;
            }

            .food-image {
                width: 65px;
                height: 65px;
            }

            .food-name {
                font-size: 14px;
            }

            select {
                min-width: 55px;
            }

        }

    </style>
</head>


<body>

    <div class="container">

        <div class="heading">

            <small>FoodTrain • Signature Selection</small>

            <h2>Explore Your Favourite</h2>

            <p class="subtitle">
                Main Course
            </p>

        </div>


        <!-- Chicken Biryani -->

        <div class="item">

            <img
                class="food-image"
                src="https://images.unsplash.com/photo-1631515242808-497c3fbd3972?auto=format&fit=crop&w=500&q=85"
                alt="Chicken Biryani"
            >

            <input
                type="checkbox"
                id="chickenbiryani"
            >

            <div class="food-info">

                <span class="food-name">
                    Chicken Biryani
                </span>

                <span class="price">
                    ₹250
                </span>

            </div>


            <div class="quantity-box">

                <span>Qty</span>

                <select id="chickenquantity">

                    <option value=""></option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>

                </select>

            </div>

        </div>


        <!-- Kaju Panner Biryani -->

        <div class="item">

            <img
                class="food-image"
                src="
[[File:Panner Vegetable Hyderabad Biryani.jpg|Panner_Vegetable_Hyderabad_Biryani]]"
                alt="Kaju Panner Biryani"
            >

            <input
                type="checkbox"
                id="kajupanner"
            >

            <div class="food-info">

                <span class="food-name">
                    Kaju Panner Biryani
                </span>

                <span class="price">
                    ₹300
                </span>

            </div>


            <div class="quantity-box">

                <span>Qty</span>

                <select id="kajupannerquantity">

                    <option value=""></option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>

                </select>

            </div>

        </div>


        <!-- Egg Masala Biryani -->

        <div class="item">

            <img
                class="food-image"
                src="https://images.unsplash.com/photo-1601050690117-94f5f6fa8bd7?auto=format&fit=crop&w=500&q=85"
                alt="Egg Masala Biryani"
            >

            <input
                type="checkbox"
                id="eggmasala"
            >

            <div class="food-info">

                <span class="food-name">
                    Egg Masala Biryani
                </span>

                <span class="price">
                    ₹200
                </span>

            </div>


            <div class="quantity-box">

                <span>Qty</span>

                <select id="eggquantity">

                    <option value=""></option>

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>

                </select>

            </div>

        </div>


        <!-- Calculate -->

        <div class="buttons">

            <button onclick="calculateMainCourse()">
                Calculate Total
            </button>

        </div>


        <label id="maincourseresult"></label>


        <!-- Next -->

        <div class="buttons">

            <button
                class="next-button"
                onclick="window.location.href='starters.html'"
            >
                Next — Starters
            </button>

        </div>

    </div>


    <script src="maincourse.js"></script>

</body>
</html>
